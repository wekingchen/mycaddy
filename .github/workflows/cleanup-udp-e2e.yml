name: 一次性清理已验证 UDP 测试分支
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-udp-e2e.yml']
permissions:
  contents: write
  actions: read
  pull-requests: read
jobs:
  cleanup:
    name: 核验成功后删除测试分支并自清理
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 检出 main
        uses: actions/checkout@v7
      - name: 核对 PR 合并、发布产物和真实 E2E 结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'wekingchen/mycaddy' ]]
          pr_state="$(gh pr view 4 --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          [[ "$pr_state" == MERGED ]] || { echo "❌ PR #4 未合并"; exit 1; }
          release="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$release" == 'v2.11.7-20261009-032641' ]] || { echo "❌ Latest Release 与验收版本不一致：$release"; exit 1; }
          conclusion="$(gh run view 37880027698 --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)"
          [[ "$conclusion" == success ]] || { echo "❌ 正式 Release E2E 尚未成功：$conclusion"; exit 1; }
          echo "✅ PR #4、正式 Release 和发布后二次 E2E 均通过"
      - name: 删除两个不再使用的测试分支
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in 'test/udp-e2e' 'test/udp-e2e-final'; do
            echo "▶ 删除已合并的旧测试分支：$branch"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "✅ 已删除 $branch"
          done
      - name: 自行清理一次性工作流
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/cleanup-udp-e2e.yml
          git commit -m '[skip actions] chore: remove completed one-time UDP test branch cleanup workflow'
          git push origin HEAD:main
          echo '✅ 一次性清理工作流已从 main 删除'
