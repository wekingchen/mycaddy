name: 一次性清理测试分支

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-release-notes-once.yml'

permissions:
  contents: write

jobs:
  cleanup-test-branch:
    name: 删除已合并测试分支
    runs-on: ubuntu-latest
    steps:
      - name: 删除 test/klzgrad-udp-over-http
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/test/klzgrad-udp-over-http"
          echo "✅ 已删除测试分支"
