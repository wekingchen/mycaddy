name: 一次性同步 Release 文档并清理测试分支

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-once.yml'

permissions:
  contents: write

jobs:
  maintenance:
    name: 同步发布说明与清理测试分支
    runs-on: ubuntu-latest
    steps:
      - name: 更新最新 Release 说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v2.11.7-20261009-002817"

          cat > release_notes.md <<'EOF'
          🚀 **NaiveProxy Caddy — v2.11.7-20261009-002817**

          ## 核心来源
          - klzgrad/forwardproxy 分支：naive
          - 上游提交：c096d6a00cb28e019cc1995b04bdc6a9311d8024
          - Caddy：v2.11.7
          - QUIC：SagerNet quic-go + klzgrad sing-quic BBRv1
          - UDP-over-HTTP：基于 imgk/forwardproxy@6d1c91becd7d530a7cca2c26d3fd8bc70035d8ec 的独立 overlay

          ## UDP-over-HTTP
          - RFC 9298 CONNECT-UDP
          - HTTP/1.1 Upgrade 流式 UDP
          - HTTP/2 Extended CONNECT 流式 UDP
          - HTTP/3 Datagram
          - CONNECT-UDP-BIND：HTTP/1.1 / HTTP/2 支持；HTTP/3 BIND 暂未实现

          ## 其他内置插件
          - jsonc-adapter
          - caddy-l4
          - Cloudflare / Tencent Cloud / DuckDNS
          - caddy-dynamicdns
          - caddy-events-exec
          - caddy-cloudflare-ip
          - caddy-trusted-cloudfront
          - caddy-webdav
          - caddy-trojan

          ## 构建策略
          每日检查 klzgrad/forwardproxy:naive。检测到新提交后，直接以最新上游为底座重新应用 UDP overlay；若上游结构变化造成 overlay 无法安全应用，构建会明确失败，不会静默停留在旧源码。

          最终产物会校验全部自定义插件依赖、UDP-over-HTTP 特征；amd64 额外执行 caddy list-modules 做运行级模块检查。
          EOF

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release_notes.md

          BODY="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')"
          grep -Fq 'HTTP/3 BIND 暂未实现' <<<"$BODY"
          grep -Fq 'klzgrad/forwardproxy 分支：naive' <<<"$BODY"
          echo "✅ Release 说明已同步"

      - name: 删除测试分支
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/test/docs-and-artifact-validation" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/test/docs-and-artifact-validation"
            echo "✅ 已删除测试分支"
          else
            echo "ℹ️ 测试分支已不存在"
          fi
