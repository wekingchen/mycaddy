name: 诊断官方 NaiveProxy 单层和双层 QUIC
on:
  push:
    branches: ['test/udp-e2e']
    paths:
      - '.github/workflows/diagnose-naive-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NAIVE_VERSION: v154.0.8037.49-4
    steps:
      - uses: actions/checkout@v4
      - name: 下载已验证候选 Caddy（不编译）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-e2e
          RUN_ID=37876720043
          for i in $(seq 1 120); do
            state="$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '[.status,.conclusion]|@tsv')"
            if [[ "$state" == *completed* ]]; then
              [[ "$state" == *success* ]] || { echo "Candidate build failed: $state"; exit 1; }
              break
            fi
            sleep 10
          done
          [[ "$state" == *success* ]] || { echo "Candidate build still pending"; exit 1; }
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name caddy-amd64 --dir /tmp/release-e2e
          tar -xzf /tmp/release-e2e/caddy_amd64.tar.gz -C /tmp/release-e2e
          chmod +x /tmp/release-e2e/caddy_amd64
      - name: 下载官方 NaiveProxy 客户端
        run: |
          set -euo pipefail
          mkdir -p /tmp/naive
          url="https://github.com/klzgrad/naiveproxy/releases/download/${NAIVE_VERSION}/naiveproxy-${NAIVE_VERSION}-linux-x64.tar.xz"
          curl -fL "$url" -o /tmp/naive.tar.xz
          tar -xJf /tmp/naive.tar.xz -C /tmp/naive
          NAIVE_BIN="$(find /tmp/naive -type f -name naive | head -n1)"
          test -n "$NAIVE_BIN"
          chmod +x "$NAIVE_BIN"
          echo "NAIVE_BIN=$NAIVE_BIN" | tee -a "$GITHUB_ENV"
          "$NAIVE_BIN" --version


      - name: 启动内外 Caddy 和本地目标
        run: |
          set -euo pipefail
          echo '127.0.0.1 outer.test inner.test' | sudo tee -a /etc/hosts >/dev/null
          mkdir -p /tmp/origin
          printf '%s\n' 'naiveproxy-connect-udp-real-chain-ok' >/tmp/origin/marker.txt
          python3 -m http.server 18081 --bind 127.0.0.1 --directory /tmp/origin >/tmp/origin.log 2>&1 &
          ORIGIN_PID=$!

          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 1 -keyout /tmp/chain.key -out /tmp/chain.crt -subj '/CN=outer.test' -addext 'subjectAltName=DNS:outer.test,DNS:inner.test,IP:127.0.0.1' >/dev/null 2>&1
          cat >/tmp/outer.Caddyfile <<'CADDY'
          {
              admin off
              debug
              auto_https disable_redirects
              servers {
                  protocols h1 h2 h3
              }
          }
          :19443, outer.test:19443 {
              tls /tmp/chain.crt /tmp/chain.key
              @naive_preamble {
                  method GET
                  path /
              }
              respond @naive_preamble 204
              log {
                  output file /tmp/outer-access.log
                  format json
              }

              forward_proxy {
                  ports 19444
                  acl {
                      allow 127.0.0.1/32
                  }
              }
          }
          CADDY
          cat >/tmp/inner.Caddyfile <<'CADDY'
          {
              admin off
              debug
              auto_https disable_redirects
              servers {
                  protocols h1 h2 h3
              }
          }
          :19444, inner.test:19444 {
              tls /tmp/chain.crt /tmp/chain.key
              @naive_preamble {
                  method GET
                  path /
              }
              respond @naive_preamble 204

              forward_proxy {
                  ports 18081
                  acl {
                      allow 127.0.0.1/32
                  }
              }
          }
          CADDY
          mkdir -p /tmp/chain-data /tmp/chain-config /tmp/inner-data /tmp/inner-config
          GODEBUG=http2xconnect=1 XDG_DATA_HOME=/tmp/inner-data XDG_CONFIG_HOME=/tmp/inner-config /tmp/release-e2e/caddy_amd64 run --config /tmp/inner.Caddyfile --adapter caddyfile >/tmp/inner-caddy.log 2>&1 &
          INNER_CADDY_PID=$!
          MYCADDY_QUIC_INITIAL_PACKET_SIZE=1452 GODEBUG=http2xconnect=1 XDG_DATA_HOME=/tmp/chain-data XDG_CONFIG_HOME=/tmp/chain-config /tmp/release-e2e/caddy_amd64 run --config /tmp/outer.Caddyfile --adapter caddyfile >/tmp/chain-caddy.log 2>&1 &
          CHAIN_CADDY_PID=$!
          sleep 2
          kill -0 "$CHAIN_CADDY_PID"
          kill -0 "$INNER_CADDY_PID"
          echo "$CHAIN_CADDY_PID" > /tmp/chain-caddy.pid
          echo "$INNER_CADDY_PID" > /tmp/inner-caddy.pid
          echo "$ORIGIN_PID" > /tmp/origin.pid
      - name: 分别测试 outer、inner、chain 并保存 Chromium NetLog
        run: |
          set -euo pipefail
          for mode in outer inner chain; do
            echo "========== TEST MODE: $mode =========="
            export MODE="$mode"
            python3 - <<'PY'
          import json, os
          mode=os.environ["MODE"]
          proxies={
              "outer":"quic://outer.test:19443",
              "inner":"quic://inner.test:19444",
              "chain":"quic://outer.test:19443,quic://inner.test:19444",
          }
          json.dump({
              "listen":"socks://127.0.0.1:11080",
              "proxy":proxies[mode],
              "host-resolver-rules":"MAP outer.test 127.0.0.1, MAP inner.test 127.0.0.1",
              "log":"","log-net-log":f"/tmp/naive-{mode}-netlog.json",
          },open(f"/tmp/naive-{mode}.json","w"))
          PY
            SSL_CERT_FILE=/tmp/chain.crt "$NAIVE_BIN" "/tmp/naive-$mode.json" >"/tmp/naive-$mode.log" 2>&1 &
            pid=$!
            for i in $(seq 1 50); do if bash -c "echo >/dev/tcp/127.0.0.1/11080" 2>/dev/null; then break; fi; sleep .2; done
            if [[ "$mode" = outer ]]; then
              curl -ksS --noproxy '' --max-time 8 --socks5-hostname 127.0.0.1:11080 -o /dev/null -w "CURL_CODE=%{http_code}\n" https://inner.test:19444/ || true
            else
              curl -sS --noproxy '' --max-time 8 --socks5-hostname 127.0.0.1:11080 http://127.0.0.1:18081/marker.txt || true
            fi
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "--- naive $mode ---"
            tail -n 40 "/tmp/naive-$mode.log" || true
            python3 - "$mode" <<'PY'
          import collections,json,sys
          path=f"/tmp/naive-{sys.argv[1]}-netlog.json"
          try: raw=[json.loads(x) for x in open(path)]
          except Exception as e: print("NETLOG_UNAVAILABLE",e);sys.exit(0)
          constants=raw[0].get("constants",{})
          names={v:k for k,v in constants.get("logEventTypes",{}).items()}
          errors={v:k for k,v in constants.get("netError",{}).items()}
          print("NETLOG_EVENTS",len(raw)-1)
          for entry in raw[1:]:
            d=entry.get("event",{}); p=d.get("params") or {}
            t=names.get(d.get("type"),str(d.get("type")))
            if t in ("UDP_CONNECT","UDP_SEND_ERROR","QUIC_SESSION_CLOSED","QUIC_SESSION_POOL_JOB_CONNECT","QUIC_SESSION_TRANSPORT_PARAMETERS_RECEIVED","QUIC_SESSION_H3_SETTINGS_RECEIVED","QUIC_SESSION_PACKET_RECEIVED","HTTP3_HEADERS_RECEIVED","CERT_VERIFIER_JOB","CERT_VERIFIER_JOB_FETCH_TRUST_ANCHORS") or ("net_error" in p and p["net_error"]<0):
              if "net_error" in p: p["net_error"]=errors.get(p["net_error"],p["net_error"])
              print("NETLOG",t,str(p)[:700])
          PY
          done
          echo "---- outer access ----"
          cat /tmp/outer-access.log 2>/dev/null || true
          echo "---- Caddy errors ----"
          grep -Ei 'error|connect-udp|http/3' /tmp/chain-caddy.log | tail -n 80 || true
      - name: 保存诊断日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naive-diagnostics
          path: |
            /tmp/naive-*.log
            /tmp/naive-*-netlog.json
            /tmp/chain-caddy.log
            /tmp/inner-caddy.log
            /tmp/outer-access.log
          retention-days: 3
      - name: 清理
        if: always()
        run: |
          for f in /tmp/chain-caddy.pid /tmp/inner-caddy.pid /tmp/origin.pid; do if [[ -f "$f" ]]; then kill "$(cat "$f")" 2>/dev/null || true; fi; done
