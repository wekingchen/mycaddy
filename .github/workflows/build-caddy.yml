name: 构建与发布 NaiveProxy Caddy（klzgrad + UDP-over-HTTP）

on:
  schedule:
    # 每天 UTC 16:00（UTC+8 00:00）检查 klzgrad/forwardproxy:naive
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '是否强制编译？'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - 'test/**'
    paths:
      - '.github/workflows/build-caddy.yml'
      - 'forwardproxy-overlay/udp_over_http.go'
      - 'forwardproxy-overlay/forwardproxy_udp_test.go'
      - 'scripts/apply-forwardproxy-udp.py'
      - 'scripts/apply-caddy-http3-datagrams.py'
      - 'tests/udp-over-http-e2e.py'
      - 'tests/udp-e2e-go/**'
      - 'tests/official-naive-e2e.sh'
      - 'tests/official-naive-chain-e2e.sh'

concurrency:
  group: build-caddy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check-updates:
    name: 检测 klzgrad naive 更新
    runs-on: ubuntu-latest
    outputs:
      upstream_commit: ${{ steps.check.outputs.upstream_commit }}
      caddy_version: ${{ steps.check.outputs.caddy_version }}
    steps:
      - name: 获取上游版本并判断是否需要构建
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          set -euo pipefail

          LATEST_COMMIT="$(curl -fsSL https://api.github.com/repos/klzgrad/forwardproxy/commits/naive | jq -r '.sha')"
          CADDY_VERSION="$(curl -fsSL https://raw.githubusercontent.com/klzgrad/forwardproxy/naive/CADDY_VERSION | tr -d '\r\n')"

          if [[ ! "$LATEST_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ 无法取得 klzgrad/forwardproxy:naive 的有效 Commit"
            exit 1
          fi
          if [[ -z "$CADDY_VERSION" ]]; then
            echo "❌ 无法读取上游 CADDY_VERSION"
            exit 1
          fi

          echo "📌 klzgrad naive 最新 Commit：$LATEST_COMMIT"
          echo "📌 上游指定 Caddy：$CADDY_VERSION"
          echo "caddy_version=$CADDY_VERSION" >> "$GITHUB_OUTPUT"

          # 测试分支/代码 push 必须构建，用于验证 overlay 自身修改。
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "🧪 代码发生变化，执行验证构建"
            echo "upstream_commit=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$FORCE_BUILD" =~ ^[Tt]rue$ ]]; then
            echo "🔄 手动触发：强制编译"
            echo "upstream_commit=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_BODY="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.body' 2>/dev/null || true)"
          CLEAN_BODY="$(printf '%s' "$RELEASE_BODY" | tr -d '*' | tr -d '🔍')"
          PREVIOUS_COMMIT="$(printf '%s' "$CLEAN_BODY"             | grep -Eo '(上游提交|提交 ID|Commit)[:：][[:space:]]*[0-9a-f]{40}'             | head -n1             | grep -Eo '[0-9a-f]{40}' || true)"

          echo "📌 上次 Release 记录的上游 Commit：${PREVIOUS_COMMIT:-未找到}"

          if [[ -z "$PREVIOUS_COMMIT" ]]; then
            echo "⚠️ 未找到 klzgrad 上游记录，执行一次迁移构建"
            echo "upstream_commit=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
          elif [[ "$LATEST_COMMIT" != "$PREVIOUS_COMMIT" ]]; then
            echo "🔄 klzgrad naive 有更新，开始构建"
            echo "upstream_commit=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
          else
            echo "✅ klzgrad naive 无更新，本次跳过"
            echo "upstream_commit=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: 编译 Caddy（${{ matrix.arch }}）
    needs: check-updates
    if: ${{ needs.check-updates.outputs.upstream_commit != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - name: 检出 mycaddy overlay
        uses: actions/checkout@v7

      - name: 设置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: 拉取指定 klzgrad naive Commit
        env:
          UPSTREAM_COMMIT: ${{ needs.check-updates.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          git init forwardproxy
          git -C forwardproxy remote add origin https://github.com/klzgrad/forwardproxy.git
          git -C forwardproxy fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git -C forwardproxy checkout --detach FETCH_HEAD

          ACTUAL_COMMIT="$(git -C forwardproxy rev-parse HEAD)"
          echo "📌 实际上游 Commit：$ACTUAL_COMMIT"
          test "$ACTUAL_COMMIT" = "$UPSTREAM_COMMIT"

      - name: 应用 UDP-over-HTTP overlay
        env:
          EXPECTED_CADDY_VERSION: ${{ needs.check-updates.outputs.caddy_version }}
        run: |
          set -euo pipefail

          ACTUAL_CADDY_VERSION="$(tr -d '\r\n' < forwardproxy/CADDY_VERSION)"
          echo "📌 klzgrad 指定 Caddy：$ACTUAL_CADDY_VERSION"
          test "$ACTUAL_CADDY_VERSION" = "$EXPECTED_CADDY_VERSION"

          cp forwardproxy-overlay/udp_over_http.go forwardproxy/
          cp forwardproxy-overlay/forwardproxy_udp_test.go forwardproxy/
          python3 scripts/apply-forwardproxy-udp.py forwardproxy/forwardproxy.go

          echo "✅ UDP-over-HTTP overlay 已应用"

      - name: 准备 klzgrad 指定的 Caddy + BBRv1
        env:
          CADDY_VERSION: ${{ needs.check-updates.outputs.caddy_version }}
        run: |
          set -euo pipefail
          git init caddy-bbr
          git -C caddy-bbr remote add origin https://github.com/caddyserver/caddy.git
          git -C caddy-bbr fetch --depth 1 origin "$CADDY_VERSION"
          git -C caddy-bbr checkout --detach FETCH_HEAD

          git -C caddy-bbr apply "$GITHUB_WORKSPACE/forwardproxy/caddy-sing-quic-bbrv1.patch"
          python3 "$GITHUB_WORKSPACE/scripts/apply-caddy-http3-datagrams.py" "$GITHUB_WORKSPACE/caddy-bbr"
          echo "✅ 已应用 klzgrad 的 sing-quic BBRv1 补丁并启用 HTTP/3 Datagram"

      - name: 运行 forwardproxy 回归测试
        working-directory: forwardproxy
        run: |
          set -euo pipefail

          # 测试必须和最终二进制使用同一套 patched Caddy / SagerNet QUIC，
          # 避免 klzgrad 原 go.mod 中旧 Caddy 的 quic-go 与 BBRv1 栈混用。
          go mod edit -replace=github.com/caddyserver/caddy/v2=../caddy-bbr
          go mod edit -require=github.com/dunglas/httpsfv@v1.1.0
          go mod edit -require=github.com/sagernet/quic-go@v0.61.0-sing-box-mod.9
          go mod tidy
          go test ./...

      - name: 安装 xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: 编译 Caddy（${{ matrix.arch }}）
        env:
          CADDY_VERSION: ${{ needs.check-updates.outputs.caddy_version }}
        run: |
          set -euo pipefail
          export GOOS=linux
          export GOARCH=${{ matrix.arch }}

          "$(go env GOPATH)/bin/xcaddy" build "$CADDY_VERSION"             --output "caddy_${{ matrix.arch }}"             --replace "github.com/caddyserver/caddy/v2=$GITHUB_WORKSPACE/caddy-bbr"             --with "github.com/caddyserver/forwardproxy=$GITHUB_WORKSPACE/forwardproxy"             --with github.com/caddyserver/jsonc-adapter             --with github.com/mholt/caddy-l4             --with github.com/caddy-dns/cloudflare             --with github.com/caddy-dns/tencentcloud             --with github.com/caddy-dns/duckdns             --with github.com/mholt/caddy-dynamicdns             --with github.com/mholt/caddy-events-exec             --with github.com/WeidiDeng/caddy-cloudflare-ip             --with github.com/xcaddyplugins/caddy-trusted-cloudfront             --with github.com/mholt/caddy-webdav             --with github.com/imgk/caddy-trojan

      - name: 运行真实 UDP-over-HTTP E2E（amd64）
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          set -euo pipefail
          echo "▶ HTTP/1.1 CONNECT-UDP"
          python3 tests/udp-over-http-e2e.py "./caddy_amd64"

          echo "▶ 准备 HTTP/2 / HTTP/3 E2E 客户端"
          (
            cd tests/udp-e2e-go
            go mod tidy
            go build -o /tmp/udp-e2e-client .
          )

          echo "▶ HTTP/2 Extended CONNECT"
          /tmp/udp-e2e-client "./caddy_amd64" h2

          echo "▶ HTTP/3 CONNECT-UDP Datagram"
          /tmp/udp-e2e-client "./caddy_amd64" h3

          echo "✅ HTTP/1.1 / HTTP/2 / HTTP/3 真实 UDP Echo 全部通过"

      - name: 下载官方 NaiveProxy 测试客户端（amd64）
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          set -euo pipefail
          NAIVE_VERSION="v154.0.8037.49-4"
          mkdir -p /tmp/naive
          url="https://github.com/klzgrad/naiveproxy/releases/download/${NAIVE_VERSION}/naiveproxy-${NAIVE_VERSION}-linux-x64.tar.xz"
          curl -fsSL --retry 3 "$url" -o /tmp/naive.tar.xz
          tar -xJf /tmp/naive.tar.xz -C /tmp/naive
          NAIVE_BIN="$(find /tmp/naive -type f -name naive | head -n1)"
          test -n "$NAIVE_BIN" && test -f "$NAIVE_BIN"
          chmod +x "$NAIVE_BIN"
          echo "NAIVE_BIN=$NAIVE_BIN" >> "$GITHUB_ENV"
          echo "✅ 已准备官方 NaiveProxy ${NAIVE_VERSION}"

      - name: 官方 NaiveProxy 真实链路 E2E（H2/H3 + 双层 QUIC）
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          set -euo pipefail
          echo "▶ 官方 NaiveProxy HTTP/2 代理"
          bash tests/official-naive-e2e.sh "./caddy_amd64" "$NAIVE_BIN" h2

          echo "▶ 官方 NaiveProxy HTTP/3 代理"
          bash tests/official-naive-e2e.sh "./caddy_amd64" "$NAIVE_BIN" h3

          echo "▶ 官方 NaiveProxy 外层 QUIC → CONNECT-UDP → 内层 QUIC"
          bash tests/official-naive-chain-e2e.sh "./caddy_amd64" "$NAIVE_BIN"

          echo "✅ 三种官方客户端链路均真实收发并通过"

      - name: 校验模块、架构并打包
        env:
          UPSTREAM_COMMIT: ${{ needs.check-updates.outputs.upstream_commit }}
          CADDY_VERSION: ${{ needs.check-updates.outputs.caddy_version }}
        run: |
          set -euo pipefail

          file "caddy_${{ matrix.arch }}"
          go version -m "caddy_${{ matrix.arch }}" | tee "buildmeta_${{ matrix.arch }}.txt"

          # 所有自定义插件都必须出现在最终 Go build info 中。
          expected_deps=(
            'github.com/caddyserver/forwardproxy'
            'github.com/caddyserver/jsonc-adapter'
            'github.com/mholt/caddy-l4'
            'github.com/caddy-dns/cloudflare'
            'github.com/caddy-dns/tencentcloud'
            'github.com/caddy-dns/duckdns'
            'github.com/mholt/caddy-dynamicdns'
            'github.com/mholt/caddy-events-exec'
            'github.com/WeidiDeng/caddy-cloudflare-ip'
            'github.com/xcaddyplugins/caddy-trusted-cloudfront'
            'github.com/mholt/caddy-webdav'
            'github.com/imgk/caddy-trojan'
          )
          for dep in "${expected_deps[@]}"; do
            grep -Fq "$dep" "buildmeta_${{ matrix.arch }}.txt" || {
              echo "❌ 最终二进制缺少依赖：$dep"
              exit 1
            }
          done

          # UDP-over-HTTP 是 forward_proxy 内部 overlay，不会注册成独立 Caddy module。
          # 因此直接检查最终二进制中的协议/配置特征，确认 overlay 代码确实被链接。
          strings "caddy_${{ matrix.arch }}" > "strings_${{ matrix.arch }}.txt"
          for marker in             'udp_uri_template'             'connect-udp'             'Connect-Udp-Bind'             '.well-known/masque/udp/'             'connect-udp-bind over http3 is not supported yet'; do
            grep -Fq "$marker" "strings_${{ matrix.arch }}.txt" || {
              echo "❌ 最终二进制缺少 UDP-over-HTTP 特征：$marker"
              exit 1
            }
          done

          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            "./caddy_${{ matrix.arch }}" list-modules | tee "modules_${{ matrix.arch }}.txt"
            expected_modules=(
              'caddy.adapters.jsonc'
              'caddy.listeners.layer4'
              'dns.providers.cloudflare'
              'dns.providers.tencentcloud'
              'dns.providers.duckdns'
              'dynamic_dns'
              'events.handlers.exec'
              'http.handlers.forward_proxy'
              'http.handlers.trojan'
              'http.handlers.webdav'
              'http.ip_sources.cloudflare'
              'http.ip_sources.cloudfront'
              'trojan'
            )
            for module in "${expected_modules[@]}"; do
              grep -qx "$module" "modules_${{ matrix.arch }}.txt" || {
                echo "❌ 最终二进制缺少 Caddy module：$module"
                exit 1
              }
            done
          else
            # x86 Runner 不能直接执行 arm64 二进制，保留 build info 作为可下载校验记录。
            cp "buildmeta_${{ matrix.arch }}.txt" "modules_${{ matrix.arch }}.txt"
          fi

          cat > "build-info_${{ matrix.arch }}.txt" <<EOF
          klzgrad/forwardproxy branch: naive
          klzgrad/forwardproxy commit: $UPSTREAM_COMMIT
          Caddy version: $CADDY_VERSION
          UDP-over-HTTP source: imgk/forwardproxy@6d1c91becd7d530a7cca2c26d3fd8bc70035d8ec
          QUIC stack: github.com/sagernet/quic-go
          CONNECT-UDP-BIND: HTTP/1.1 and HTTP/2 supported; HTTP/3 bind is not implemented
          EOF

          tar -czf "caddy_${{ matrix.arch }}.tar.gz"             "caddy_${{ matrix.arch }}"             "build-info_${{ matrix.arch }}.txt"

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: caddy-${{ matrix.arch }}
          path: |
            caddy_${{ matrix.arch }}.tar.gz
            modules_${{ matrix.arch }}.txt

  release:
    name: 发布 Release
    needs: [check-updates, build]
    if: ${{ github.ref == 'refs/heads/main' && needs.check-updates.outputs.upstream_commit != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: 下载 amd64 包
        uses: actions/download-artifact@v7
        with:
          name: caddy-amd64
          path: release

      - name: 下载 arm64 包
        uses: actions/download-artifact@v7
        with:
          name: caddy-arm64
          path: release

      - name: 生成发布信息
        env:
          CADDY_VERSION: ${{ needs.check-updates.outputs.caddy_version }}
          UPSTREAM_COMMIT: ${{ needs.check-updates.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          VERSION_NO_V="${CADDY_VERSION#v}"
          TAG="v${VERSION_NO_V}-$(date -u +'%Y%m%d-%H%M%S')"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

          cat > release_notes.md <<EOF
          🚀 **NaiveProxy Caddy — $TAG**

          ## 核心来源
          - klzgrad/forwardproxy 分支：naive
          - 上游提交：$UPSTREAM_COMMIT
          - Caddy：$CADDY_VERSION
          - QUIC：SagerNet quic-go + klzgrad sing-quic BBRv1
          - UDP-over-HTTP：基于 imgk/forwardproxy@6d1c91becd7d530a7cca2c26d3fd8bc70035d8ec 的独立 overlay

          ## UDP-over-HTTP
          - RFC 9298 CONNECT-UDP
          - HTTP/1.1 Upgrade 流式 UDP
          - HTTP/2 Extended CONNECT 流式 UDP
          - HTTP/3 Datagram
          - CONNECT-UDP-BIND：HTTP/1.1 / HTTP/2 支持；HTTP/3 BIND 暂未实现
          - 真实 E2E：H1/H2/H3 UDP Echo；官方 NaiveProxy H2/H3；官方双层 QUIC-over-CONNECT-UDP 流量及首次握手 MTU 校验

          ## 其他内置插件
          - jsonc-adapter
          - caddy-l4
          - Cloudflare / Tencent Cloud / DuckDNS
          - caddy-dynamicdns
          - caddy-events-exec
          - caddy-cloudflare-ip
          - caddy-trusted-cloudfront
          - caddy-webdav
          - caddy-trojan

          ## 构建策略
          每日检查 klzgrad/forwardproxy:naive。检测到新提交后，直接以最新上游为底座重新应用 UDP overlay；若上游结构变化造成 overlay 无法安全应用，构建会明确失败，不会静默停留在旧源码。
          EOF

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --title "NaiveProxy Caddy $TAG"             --notes-file release_notes.md             release/caddy_amd64.tar.gz             release/caddy_arm64.tar.gz

      - name: 显式触发已发布产物 H1/H2/H3 + 官方 NaiveProxy E2E
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release-udp-e2e.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f release_tag="$TAG"
          echo "✅ 已为 $TAG 触发独立 Release E2E：直接下载原始附件，不重复编译 Caddy"
