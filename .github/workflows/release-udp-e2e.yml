name: Release UDP E2E（H1/H2/H3）

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  udp-e2e:
    name: 正式 Release 三协议真实 UDP 验证
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出测试客户端
        uses: actions/checkout@v7

      - name: 设置 Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: 下载待验证 Release 原始 amd64 产物
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-}"
          if [ -z "$TAG" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "📌 验证 Release：$TAG"
          mkdir -p /tmp/release-e2e
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'caddy_amd64.tar.gz' --dir /tmp/release-e2e
          sha256sum /tmp/release-e2e/caddy_amd64.tar.gz
          tar -xzf /tmp/release-e2e/caddy_amd64.tar.gz -C /tmp/release-e2e
          chmod +x /tmp/release-e2e/caddy_amd64
          /tmp/release-e2e/caddy_amd64 version

      - name: HTTP/1.1 CONNECT-UDP 真实 UDP Echo
        run: |
          set -euo pipefail
          python3 tests/udp-over-http-e2e.py /tmp/release-e2e/caddy_amd64

      - name: 构建 HTTP/2 + HTTP/3 E2E 测试客户端
        run: |
          set -euo pipefail
          cd tests/udp-e2e-go
          go mod tidy
          go build -o /tmp/udp-e2e-client .

      - name: HTTP/2 Extended CONNECT 真实 UDP Echo
        run: |
          set -euo pipefail
          /tmp/udp-e2e-client /tmp/release-e2e/caddy_amd64 h2

      - name: HTTP/3 CONNECT-UDP Datagram 真实 UDP Echo
        run: |
          set -euo pipefail
          /tmp/udp-e2e-client /tmp/release-e2e/caddy_amd64 h3

      - name: 三协议验收完成
        run: echo "✅ Release 原始二进制的 HTTP/1.1 / HTTP/2 / HTTP/3 UDP Echo 全部通过"
