name: Latest Release UDP E2E（不重新编译）
on:
  push:
    branches: ['test/udp-e2e']
    paths:
      - '.github/workflows/release-udp-e2e.yml'
      - 'tests/udp-over-http-e2e.py'
      - 'tests/udp-over-http-h2h3-e2e.go'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-udp-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go 测试客户端环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: 下载 Latest Release 原始 Caddy 二进制
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-e2e
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'caddy_amd64.tar.gz' --dir /tmp/release-e2e
          tar -xzf /tmp/release-e2e/caddy_amd64.tar.gz -C /tmp/release-e2e
          chmod +x /tmp/release-e2e/caddy_amd64
          echo "📌 正在测试的正式发布版本：$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
          /tmp/release-e2e/caddy_amd64 version

      - name: HTTP/1.1 真实 UDP Echo 往返
        run: |
          set -euo pipefail
          python3 tests/udp-over-http-e2e.py /tmp/release-e2e/caddy_amd64

      - name: 准备 HTTP/2 + HTTP/3 标准测试客户端
        run: |
          set -euo pipefail
          rm -rf /tmp/udp-e2e-client
          mkdir -p /tmp/udp-e2e-client
          cp tests/udp-over-http-h2h3-e2e.go /tmp/udp-e2e-client/main.go
          cd /tmp/udp-e2e-client
          go mod init mycaddy-udp-e2e
          go get golang.org/x/net@latest
          go get github.com/quic-go/masque-go@v0.4.0
          go get github.com/yosida95/uritemplate/v3@latest
          go mod tidy
          go build -o /tmp/udp-e2e-client/e2e .

      - name: HTTP/2 + HTTP/3 CONNECT-UDP 真实 UDP Echo 往返
        env:
          GODEBUG: http2xconnect=1
        run: |
          set -euo pipefail
          /tmp/udp-e2e-client/e2e /tmp/release-e2e/caddy_amd64

      - name: 下载最新 NaiveProxy 客户端并记录版本
        run: |
          set -euo pipefail
          NP_TAG="v154.0.8037.49-4"
          curl -fL --retry 3             -o /tmp/naive.tar.xz             "https://github.com/klzgrad/naiveproxy/releases/download/$NP_TAG/naiveproxy-$NP_TAG-linux-x64.tar.xz"
          mkdir -p /tmp/naive
          tar -xJf /tmp/naive.tar.xz -C /tmp/naive
          echo "📌 NaiveProxy 客户端：$NP_TAG"
          find /tmp/naive -maxdepth 2 -type f -print
