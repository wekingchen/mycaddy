name: Latest Release UDP E2E（不重新编译）

on:
  push:
    branches: ['test/udp-e2e']
    paths:
      - '.github/workflows/release-udp-e2e.yml'
      - 'tests/udp-over-http-e2e.py'
      - 'tests/udp-e2e-go/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-udp-e2e:
    name: Latest Release HTTP/1.1 + HTTP/2 + HTTP/3 UDP E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go 测试环境
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache: false

      - name: 下载 Latest Release 原始二进制
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-e2e
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '"LATEST_RELEASE=" + .tagName' | tee -a "$GITHUB_ENV"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'caddy_amd64.tar.gz' --dir /tmp/release-e2e
          tar -xzf /tmp/release-e2e/caddy_amd64.tar.gz -C /tmp/release-e2e
          chmod +x /tmp/release-e2e/caddy_amd64
          /tmp/release-e2e/caddy_amd64 version
          sha256sum /tmp/release-e2e/caddy_amd64.tar.gz /tmp/release-e2e/caddy_amd64

      - name: 下载官方 klzgrad naiveproxy 客户端
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/naive-official
          gh release download v154.0.8037.49-4 \
            --repo klzgrad/naiveproxy \
            --pattern 'naiveproxy-v154.0.8037.49-4-linux-x64.tar.xz' \
            --dir /tmp/naive-official
          tar -xJf /tmp/naive-official/naiveproxy-v154.0.8037.49-4-linux-x64.tar.xz -C /tmp/naive-official
          NAIVE_BIN="$(find /tmp/naive-official -type f -name naive -print -quit)"
          test -n "$NAIVE_BIN"
          chmod +x "$NAIVE_BIN"
          "$NAIVE_BIN" --version
          echo "NAIVE_BIN=$NAIVE_BIN" >> "$GITHUB_ENV"

      - name: 官方 naive 客户端 HTTP/2 隧道兼容性
        run: bash tests/official-naive-e2e.sh /tmp/release-e2e/caddy_amd64 "$NAIVE_BIN" h2

      - name: 官方 naive 客户端 HTTP/3 隧道兼容性
        run: bash tests/official-naive-e2e.sh /tmp/release-e2e/caddy_amd64 "$NAIVE_BIN" h3

      - name: HTTP/1.1 真实 UDP Echo 往返
        id: h1
        run: python3 tests/udp-over-http-e2e.py /tmp/release-e2e/caddy_amd64

      - name: 准备 HTTP/2 + HTTP/3 E2E 客户端
        working-directory: tests/udp-e2e-go
        run: |
          set -euo pipefail
          go mod tidy
          go build -o /tmp/udp-e2e-client .

      - name: HTTP/2 Extended CONNECT 真实 UDP Echo 往返
        id: h2
        continue-on-error: true
        run: /tmp/udp-e2e-client /tmp/release-e2e/caddy_amd64 h2

      - name: HTTP/3 CONNECT-UDP Datagram 真实 UDP Echo 往返
        id: h3
        continue-on-error: true
        run: /tmp/udp-e2e-client /tmp/release-e2e/caddy_amd64 h3

      - name: 三协议验收
        env:
          H2_OUTCOME: ${{ steps.h2.outcome }}
          H3_OUTCOME: ${{ steps.h3.outcome }}
        run: |
          set -euo pipefail
          echo "Latest Release: $LATEST_RELEASE"
          echo "HTTP/1.1: PASS"
          echo "HTTP/2: $H2_OUTCOME"
          echo "HTTP/3: $H3_OUTCOME"
          test "$H2_OUTCOME" = success
          test "$H3_OUTCOME" = success
          echo "✅ 三协议真实 UDP Echo E2E 全部通过"
